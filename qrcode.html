<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Check-In</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

</head>

<body>

<div class="app">

<div class="card">

<h1>My Appointment QR Code</h1>

<a href="home.html" class="btn secondary">
Back to Home
</a>

</div>

<div class="card">

<div id="qrList">
Loading QR codes...
</div>

</div>

</div>

<script type="module" src="firebase.js"></script>

<script>

let currentUser;

checkUser(user => {

if (!user) {

window.location.href = "login.html";

}

else {

currentUser = user;

loadQR();

}

});

function loadQR() {

const appointmentsRef =
ref(db, "appointments/" + currentUser.uid);

onValue(appointmentsRef, snapshot => {

const data = snapshot.val();

if (!data) {

document.getElementById("qrList").innerHTML =
"No appointments available.";

return;

}

let html = "";

for (let id in data) {

let a = data[id];

html += `
<div class="item">

<h3>

${a.date} — ${a.time}

</h3>

<p>

Doctor:
<b>${a.doctor}</b>

</p>

<div id="qr-${id}"></div>

</div>
`;

}

document.getElementById("qrList").innerHTML =
html;

for (let id in data) {

let qrData =
currentUser.uid + "|" + id;

QRCode.toCanvas(

document.getElementById("qr-" + id),

qrData

);

}

});

}

</script>

</body>

</html>
